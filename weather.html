<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
    <link rel="icon" type="image/x-icon" href="images/weather.png">
</head>
<body>
    
    <div class="weather">
        <div class="inputbutton">
            <input type="text" class="input" placeholder="Enter City Name">
            <button class="button" id="button" title="Click to Search">
               
         <img src="images/search-icon-30.png" alt="search icon">
            </button>
        </div>

        <img src="images/weather-forecast-96.png" class="weathericon" alt="weather icon">
        <h1 id="temperature">°C</h1>
        <h2 id="cityname">CityName</h2>

        <div class="humiditywind">
            
        <div class="h1">
            <img src="images/humidity-50.png" alt="humidity icon">
             <div class="humidity">
                    <p class="hm">%</p>
                    <p class="hm">humidity</p>
        </div>
            </div>
            <div class="w1">
                <img src="images/wind-48.png" alt="wind icon">
                <div class="wind">
                    <p class="ws">km/h</p>
                    <p class="ws">wind speed</p>
                </div>
            </div>
        </div>

        <!-- Toast message for errors... -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
